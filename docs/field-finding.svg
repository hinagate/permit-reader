<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 556" width="710" height="556" role="img"><title>Sample permit drawn from OCR boxes, with the search regions for each field (dummy values)</title><style>
:root { --surface:#ffffff; --fg:#141c31; --muted:#5b6680; --line:#d2d8e4; --accent:#1e4fa6;
  --gold:#b97f06; --gold-fill:#f6c84c; --teal:#23807a; --slate:#7d8aa6; --error:#b2372a;
  --font-body:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; --font-mono:ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; --font-cjk:"Microsoft JhengHei", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --surface:#151d30; --fg:#e5eaf4; --muted:#9ba7c0; --line:#2b3551; --accent:#88aaff;
    --gold:#f2bf4a; --gold-fill:#f2bf4a; --teal:#5cc8bf; --slate:#8b97b2; --error:#f28a7a; }
}
text { font-family: var(--font-body); }
.panel { fill: var(--surface); stroke: var(--line); }

.zone { fill: var(--accent); fill-opacity: 0.07; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; }
.decoy { fill: none; stroke: var(--slate); stroke-width: 1.2; stroke-dasharray: 2 3; }
.colguide { stroke: var(--teal); stroke-width: 1.2; stroke-dasharray: 2 3; }
.cjk-t { font-family: var(--font-cjk); }
.ob-label rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; }
.ob-label text { fill: var(--accent); font-weight: 600; }
.ob-value rect { fill: var(--gold-fill); fill-opacity: 0.42; stroke: var(--gold); stroke-width: 1.2; }
.ob-value text { fill: var(--fg); font-weight: 600; }
.ob-caption rect { fill: none; stroke: var(--teal); stroke-width: 1.2; }
.ob-caption text { fill: var(--teal); }
.ob-other rect { fill: none; stroke: var(--line); stroke-width: 1; }
.ob-other text { fill: var(--muted); }
.badge circle { fill: var(--accent); }
.badge text { fill: var(--surface); font: 700 11px var(--font-body); }
.badge.x circle { fill: var(--slate); }
.lg { font: 400 12px var(--font-body); fill: var(--muted); }
