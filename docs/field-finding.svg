chor="middle">15</text></g><g class="ob-other"><rect x="734.0" y="1080.0" width="21.0" height="25.0" rx="2"/><text x="744.5" y="1097.9" font-size="15.0" text-anchor="middle">6</text></g><g class="ob-other"><rect x="794.0" y="1081.0" width="50.0" height="28.0" rx="2"/><text x="797.0" y="1100.8" font-size="16.0">2026</text></g><g class="ob-other"><rect x="542.0" y="1108.0" width="91.0" height="26.0" rx="2"/><text x="545.0" y="1126.6" font-size="15.6" textLength="85.0" lengthAdjust="spacingAndGlyphs">Date of Issue</text></g><g class="ob-other"><rect x="644.0" y="1109.0" width="49.0" height="29.0" rx="2"/><text class="cjk-t" x="647.0" y="1129.3" font-size="16.0" textLength="43.0" lengthAdjust="spacingAndGlyphs">日Day</text></g><g class="ob-other"><rect x="713.0" y="1115.0" width="62.0" height="25.0" rx="2"/><text class="cjk-t" x="716.0" y="1132.9" font-size="15.0" textLength="56.0" lengthAdjust="spacingAndGlyphs">月Month</text></g><g class="ob-other"><rect x="795.0" y="1120.0" width="51.0" height="21.0" rx="2"/><text class="cjk-t" x="798.0" y="1135.0" font-size="12.6">年Year</text></g><g class="badge"><circle cx="606" cy="713" r="9"/><text x="606" y="717" text-anchor="middle">A</text></g><g class="badge"><circle cx="872" cy="714" r="9"/><text x="872" y="718" text-anchor="middle">B</text></g><g class="badge"><circle cx="872" cy="806" r="9"/><text x="872" y="810" text-anchor="middle">C</text></g><g class="badge"><circle cx="872" cy="957" r="9"/><text x="872" y="961" text-anchor="middle">D</text></g><g class="badge x"><circle cx="862" cy="1070" r="9"/><text x="862" y="1074" text-anchor="middle">×</text></g><g class="ob-label"><rect x="215" y="1174" width="20" height="13" rx="2"/></g><text class="lg" x="243" y="1185">printed label (anchor)</text><g class="ob-value"><rect x="445" y="1174" width="20" height="13" rx="2"/></g><text class="lg" x="473" y="1185">value read</text><g class="ob-caption"><rect x="675" y="1174" width="20" height="13" rx="2"/></g><text class="lg" x="703" y